<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sophie · Coach de révision EDN</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="topbar" class="topbar"></div>

<main>
  <div class="card" id="hero-card">
    <h1 class="mt0" id="hero-title">Chargement…</h1>
    <p class="text-muted" id="hero-sub"></p>
  </div>

  <div class="card">
    <h2 class="mt0">Repères</h2>
    <div id="repere-block"></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>Cette semaine</h2>
      <div id="today-block">Chargement du planning…</div>
    </div>
    <div class="card">
      <h2>Cartes à réviser</h2>
      <div id="cards-block">Chargement des cartes…</div>
    </div>
  </div>

  <div class="card">
    <h2>Avancement par spécialité</h2>
    <div id="deck-progress"></div>
  </div>
</main>

<footer>Les données de progression (cartes, journal) sont conservées côté serveur — voir la page Journal pour la sauvegarde.</footer>

<script type="module">
import {
  loadPlanning, loadAllCards, getSrsState, isDue, todayISO,
  formatDateFR, formatDateShort, renderTopbar, daysBetween, toast, initData, findCurrentWeek,
  loadGardes, gardesInRange
} from "./js/app.js";

const iso = todayISO();

async function init() {
  const [planning, , gardesData] = await Promise.all([loadPlanning(), initData(), loadGardes()]);
  renderTopbar("index.html", planning);

  const heroTitle = document.getElementById("hero-title");
  const heroSub = document.getElementById("hero-sub");
  const diffPartiel = daysBetween(iso, planning.meta.cible_immediate.date);
  heroTitle.textContent =
    diffPartiel > 0 ? `${diffPartiel} jours avant le partiel du 16/02` : diffPartiel === 0 ? "Jour J — partiel aujourd'hui" : "EDN — tour complet en cours";
  heroSub.textContent = formatDateFR(iso) + " — " + planning.meta.principe_directeur;

  renderToday(planning, gardesData);
  await renderCards();
  renderRepere(planning, gardesData);
}

function renderToday(planning, gardesData) {
  const block = document.getElementById("today-block");
  const semaine = findCurrentWeek(planning, iso);

  if (semaine) {
    const semaineGardes = gardesInRange(gardesData.gardes || [], semaine.debut, semaine.fin);
    block.innerHTML = `
      <div class="pill">Semaine ${semaine.s} / 22</div>
      ${semaine.vacances ? `<span class="badge-vacances">rythme allégé</span>` : ""}
      <p style="margin-top:10px"><strong>Matière —</strong> ${semaine.matiere}</p>
      <p><strong>Sujet —</strong> ${semaine.sujet}</p>
      ${semaine.edn_transversal ? `<p><strong>Fil rouge EDN (≈20%) —</strong> ${semaine.edn_transversal}</p>` : ""}
      ${semaineGardes.map((g) => `<p class="note" style="color:var(--accent-dark)">🩹 Garde le ${formatDateShort(g.debut_date)} → jour allégé le ${formatDateShort(g.jour_recuperation)}</p>`).join("")}
      ${semaine.note ? `<p class="note" style="color:var(--accent-dark);font-style:italic">${semaine.note}</p>` : ""}
      <a href="planning.html" class="btn" style="margin-top:8px;display:inline-block">Voir le planning complet →</a>
    `;
  } else {
    const semaines = planning.phase_partiel.semaines;
    const beforeStart = iso < semaines[0].debut;
    const afterEnd = iso > semaines[semaines.length - 1].fin;
    if (beforeStart) {
      block.innerHTML = `<p>La préparation du partiel commence le ${formatDateFR(semaines[0].debut)}.</p>`;
    } else if (afterEnd) {
      block.innerHTML = `<p>Le partiel est passé — place au tour EDN complet. Consulte la page Planning pour la structure.</p><a href="planning.html" class="btn">Voir le planning →</a>`;
    } else {
      block.innerHTML = `<p>Semaine hors planning détaillé. Consulte la page Planning.</p>`;
    }
  }
}

async function renderCards() {
  const block = document.getElementById("cards-block");
  const { cards } = await loadAllCards();
  const state = getSrsState();
  const due = cards.filter((c) => isDue(c.id, state, iso));
  const dueA = due.filter((c) => c.rang === "A").length;
  const neverSeen = cards.filter((c) => !state[c.id]).length;

  block.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${due.length}</div><div class="label">Dues aujourd'hui</div></div>
      <div class="stat"><div class="num">${dueA}</div><div class="label">Rang A dues</div></div>
      <div class="stat"><div class="num">${neverSeen}</div><div class="label">Jamais vues</div></div>
    </div>
    <a href="cartes.html" class="btn primary" style="margin-top:14px;display:inline-block">
      ${due.length > 0 ? `Réviser les ${due.length} cartes dues →` : "Parcourir les cartes →"}
    </a>
  `;
}

function renderRepere(planning, gardesData) {
  const el = document.getElementById("repere-block");
  const ci = planning.meta.cible_immediate;
  const cp = planning.meta.cible_principale;
  const prochaine = (gardesData.gardes || []).find((g) => g.jour_recuperation >= iso);

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat">
        <div class="num" style="font-size:15px">Partiel</div>
        <div class="label">${formatDateShort(ci.date)} · confirmé</div>
      </div>
      <div class="stat">
        <div class="num" style="font-size:15px">EDN (estimation)</div>
        <div class="label">~${formatDateShort(cp.date_estimee_ordre_de_grandeur)} <span class="badge-warn">à confirmer</span></div>
      </div>
      <div class="stat">
        <div class="num" style="font-size:15px">Prochaine garde</div>
        <div class="label">${prochaine ? `${formatDateShort(prochaine.debut_date)} → ${formatDateShort(prochaine.jour_recuperation)}` : gardesData.enabled ? "aucune connue" : "sync. désactivée"}</div>
      </div>
    </div>
    <p class="small text-muted" style="margin-top:10px">Matières du partiel : ${ci.matieres.join(", ")}.</p>
    <div class="warn-box">${cp.statut_dates}</div>
  `;
}

// Deck progress uses cartes data + srs state
async function renderDeckProgress() {
  const el = document.getElementById("deck-progress");
  const { decks, cards } = await loadAllCards();
  const state = getSrsState();
  el.innerHTML = decks
    .map((d) => {
      const deckCards = cards.filter((c) => c.deck === d.cle);
      if (deckCards.length === 0) return "";
      const seen = deckCards.filter((c) => state[c.id]).length;
      const pct = Math.round((seen / deckCards.length) * 100);
      return `
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span class="deck-tag"><span class="deck-dot" style="background:${d.couleur}"></span>${d.nom}</span>
            <span class="text-muted">${seen}/${deckCards.length}</span>
          </div>
          <div class="progress-bar"><div class="fill" style="width:${pct}%;background:${d.couleur}"></div></div>
        </div>`;
    })
    .join("");
}

init().then(renderDeckProgress).catch((e) => {
  console.error(e);
  toast("Erreur de chargement des données");
});
</script>
</body>
</html>
