# Depuis la racine du projet : docker compose -f deploy/compose.yaml up -d --build
# .env (non versionné) :
#   EDN_MCP_TOKEN=<chaîne aléatoire ≥ 24 caractères>   (ex. : openssl rand -hex 24)
#   EDN_SITE_PASSWORD=<mot de passe du site de lecture des PDF>
#   EDN_PUBLIC_URL=https://<ton-domaine>   (sans « / » final ; sert à fabriquer les liens vers les pages de cours)
services:
  coach-internat:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    # Utilisateur du conteneur = propriétaire du dossier suivi/. Linux (Freebox) : EDN_UID=$(id -u) EDN_GID=$(id -g) dans .env.
    # Docker Desktop (Mac/Windows) : EDN_UID=0 EDN_GID=0 (root dans la VM écrit avec TES droits sur le disque ; un autre uid est refusé).
    user: "${EDN_UID:-1000}:${EDN_GID:-1000}"
    environment:
      EDN_MCP_TOKEN: ${EDN_MCP_TOKEN:?définir EDN_MCP_TOKEN}
      EDN_SITE_PASSWORD: ${EDN_SITE_PASSWORD:?définir EDN_SITE_PASSWORD}
      EDN_PUBLIC_URL: ${EDN_PUBLIC_URL:?définir EDN_PUBLIC_URL}
      EDN_CALENDAR_ICS_URL: ${EDN_CALENDAR_ICS_URL:-}   # facultatif : calendrier iCloud/webcal des gardes (secret, jamais affiché ni versionné)
    volumes:
      - ../suivi:/data              # SUIVI sur le disque de l'hôte (dossier ./suivi) : survit à restart, rebuild, down -v et rm du conteneur
      - ../cours:/app/cours:ro      # les PDF d'origine (non copiés dans l'image : 1,7 Go)
    ports: [ "127.0.0.1:8001:8001" ]   # exposer en HTTPS via un tunnel / reverse proxy (voir README)
